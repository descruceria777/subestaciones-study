<script>
const TOPICS = [
  "1. Componentes simétricas: fundamentos, operador a y matrices",
  "2. Cargas, impedancias y neutro en componentes simétricas",
  "3. Circuitos de secuencia: generadores, líneas, transformadores",
  "4. Fallas asimétricas: SLG, LL, 2LG (y trifásica)",
  "5. Aislamiento eléctrico: fundamentos y factores",
  "6. Resistencia de aislamiento (prueba DC)",
  "7. Tangente delta (prueba AC), modos y tip-up",
  "8. Pruebas en campo: equipos, procedimiento e interpretación",
  "9. Sistema de potencia, subestación y valores asignados",
  "10. Interruptores, seccionadores y relés auxiliares",
  "11. Transformadores de potencia y de medida",
  "12. Pararrayos",
  "13. Aisladores, barrajes, conductores y conexiones",
  "14. Humedad y ambiente",
  "15. Mercado de metales y contratos",
  "16. Infraestructura y servicios de la subestación",
  "17. Cortocircuito: asimetría, Ik, Ip, TRV e impulsos"
];
const GROUPS = {
  comp:{name:"Componentes simétricas (PDF Componentes)",topics:[0,1,2,3,16]},
  aisl:{name:"Pruebas de aislamiento (PDF Pruebas de diagnóstico)",topics:[4,5,6,7]},
  gen:{name:"Equipos y temas del Parcial 1 y parciales anteriores",topics:[8,9,10,11,12,13,14,15]}
};

const SUM = [];

SUM[0] = [
 ["Para qué sirve y de dónde viene",
  `<p>Un sistema trifásico <b>simétrico y balanceado</b> se analiza con una sola fase (el “equivalente monofásico”). Pero las fallas (excepto la trifásica), las cargas desiguales y las líneas abiertas producen sistemas <b>desbalanceados</b>, y entonces las tres fases se acoplan y el análisis se vuelve difícil. Las <b>componentes simétricas</b> convierten ese problema desbalanceado en <b>tres problemas balanceados</b> que sí se resuelven con un circuito monofásico cada uno.</p>
   <p>El método lo desarrolló el ingeniero canadiense <b>Charles Fortescue</b>, que trabajaba para Westinghouse; lo presentó en 1918 con el artículo <i>Method of Symmetrical Co-ordinates Applied to the Solution of Polyphase Networks</i>. Antes, en 1915, <b>L. G. Stokvis</b> lo había explicado por primera vez. Hoy se usa en los <b>estudios de protecciones (fallas)</b> y en el <b>dimensionamiento de equipos</b>.</p>
   <p class="read">Leer: PDF <b>Componentes</b>, págs. 2–8 (objetivos, introducción, historia). Concepto clave: “el método permite analizar fenómenos complejos en términos muy simples” (pág. 8).</p>`],
 ["Idea central: tres sistemas balanceados",
  `<p>Un sistema desbalanceado de tres fasores (I<sub>a</sub>, I<sub>b</sub>, I<sub>c</sub>) se puede representar como la <b>suma de tres sistemas trifásicos balanceados</b>:</p>
   <ul>
   <li><b>Secuencia positiva (1):</b> tres fasores de igual magnitud, desfasados 120°, que giran en el <b>mismo sentido</b> que el sistema original (orden a-b-c).</li>
   <li><b>Secuencia negativa (2):</b> tres fasores de igual magnitud, desfasados 120°, que giran en <b>sentido contrario</b> (orden a-c-b).</li>
   <li><b>Secuencia cero (0) u homopolar:</b> tres fasores de <b>igual magnitud y en fase</b> (0°). No giran uno respecto del otro.</li></ul>
   <p>Cada fasor de fase es la suma de sus tres componentes: <b>I<sub>a</sub> = I<sub>a0</sub> + I<sub>a1</sub> + I<sub>a2</sub></b>; I<sub>b</sub> = I<sub>a0</sub> + a²I<sub>a1</sub> + aI<sub>a2</sub>; I<sub>c</sub> = I<sub>a0</sub> + aI<sub>a1</sub> + a²I<sub>a2</sub>. Se toma la fase <b>a</b> como referencia y las otras componentes se obtienen girando con el operador a.</p>
   <p>El método se apoya en el <b>principio de superposición</b>, que solo es válido si el sistema es <b>lineal</b> (impedancias constantes). Los circuitos de secuencia se conectan entre sí <b>únicamente en el punto de desbalance</b> (por ejemplo, el punto de falla); en el resto de la red los tres circuitos son independientes.</p>
   <p>En inglés/otros idiomas: <i>positive, negative, zero</i>; en español: <b>directa, inversa, homopolar</b> (el PDF trae una tabla de terminología en la pág. 13).</p>
   <p class="read">Leer: PDF <b>Componentes</b>, págs. 4 (asimetrías y superposición), 8, 9, 12 (el método), 13 (terminología) y 14 (figura de la descomposición de I<sub>a</sub>, I<sub>b</sub>, I<sub>c</sub> en I⁺, I⁻, I⁰).</p>`],
 ["El operador a",
  `<p><b>a</b> es un operador fasorial de magnitud 1 y ángulo 120°: <b>a = 1∠120° = e<sup>j120°</sup> = −½ + j√3/2</b>. Multiplicar un fasor por a lo <b>rota 120°</b> sin cambiar su magnitud. Propiedades que debes saber de memoria:</p>
   <ul>
   <li>a² = 1∠240° = −½ − j√3/2</li>
   <li>a³ = 1 (tres giros de 120° dan una vuelta completa)</li>
   <li><b>1 + a + a² = 0</b> (tres fasores iguales a 120° suman cero)</li>
   <li>a − a² = j√3 y a² − a = −j√3. Ojo: al calcular a − a² con a = −½ + j√3/2 y a² = −½ − j√3/2 el resultado es <b>+j√3</b>; en mi lectura de la diapositiva de la pág. 11 aparece con signo negativo, así que verifica ese renglón en tu PDF antes de memorizarlo.</li></ul>
   <p>Por qué importa: de 1 + a + a² = 0 sale que la secuencia cero se obtiene sumando las tres fases y que, en un sistema balanceado de secuencia positiva, la suma de las tres corrientes es cero.</p>
   <p class="read">Leer: PDF <b>Componentes</b>, págs. 10 (definición de a) y 11 (propiedades).</p>`],
 ["Matriz de transformación A y su inversa",
  `<p>En notación matricial: <b>[I<sub>abc</sub>] = [A][I<sub>012</sub>]</b>, con
   A = [1 1 1; 1 a² a; 1 a a²]. Para pasar de fase a secuencia se usa la inversa: <b>[I<sub>012</sub>] = [A]<sup>−1</sup>[I<sub>abc</sub>]</b>, con <b>A<sup>−1</sup> = ⅓ [1 1 1; 1 a a²; 1 a² a]</b>. Lo mismo vale para tensiones: [V<sub>abc</sub>] = [A][V<sub>012</sub>] y [V<sub>012</sub>] = [A]<sup>−1</sup>[V<sub>abc</sub>].</p>
   <p>Escrito ecuación por ecuación (las que más caen en un parcial):</p>
   <ul>
   <li><b>I<sub>0</sub> = ⅓ (I<sub>a</sub> + I<sub>b</sub> + I<sub>c</sub>)</b>: es el promedio de las tres fases.</li>
   <li><b>I<sub>1</sub> = ⅓ (I<sub>a</sub> + a·I<sub>b</sub> + a²·I<sub>c</sub>)</b></li>
   <li><b>I<sub>2</sub> = ⅓ (I<sub>a</sub> + a²·I<sub>b</sub> + a·I<sub>c</sub>)</b></li></ul>
   <p>Regla para no confundirte: en la fila de secuencia <b>positiva</b> los coeficientes avanzan como a, a²; en la <b>negativa</b> como a², a. Si intercambias fila 2 y fila 3 de A⁻¹ cambias de positiva a negativa.</p>
   <p><b>Dos comprobaciones rápidas.</b> (1) Sistema balanceado positivo: I<sub>a</sub> = 1∠0°, I<sub>b</sub> = 1∠−120°, I<sub>c</sub> = 1∠120° da I<sub>1</sub> = 1, I<sub>0</sub> = I<sub>2</sub> = 0. (2) Solo hay corriente en la fase a (I<sub>a</sub> = 3, I<sub>b</sub> = I<sub>c</sub> = 0): da I<sub>0</sub> = I<sub>1</sub> = I<sub>2</sub> = 1. Este segundo caso es exactamente lo que ocurre en una falla monofásica a tierra.</p>
   <p class="read">Leer: PDF <b>Componentes</b>, págs. 15–16 (matriz A para corrientes), 17 (A⁻¹) y 18 (tensiones).</p>`],
 ["Potencia en componentes simétricas",
  `<p>Entre los objetivos del capítulo (pág. 2) está relacionar corrientes, tensiones y <b>potencias</b> de fase y de secuencia. La potencia compleja trifásica es S = V<sub>a</sub>I<sub>a</sub>* + V<sub>b</sub>I<sub>b</sub>* + V<sub>c</sub>I<sub>c</sub>*. Sustituyendo con la matriz A se obtiene
   <b>S = 3 (V<sub>0</sub>I<sub>0</sub>* + V<sub>1</sub>I<sub>1</sub>* + V<sub>2</sub>I<sub>2</sub>*)</b>. Cada secuencia aporta su propia potencia y no hay términos cruzados. El factor <b>3</b> aparece porque la matriz A no es unitaria (A<sup>H</sup>A = 3I); si se usa una matriz normalizada (1/√3) el factor desaparece. (Esta fórmula no está escrita en las diapositivas: es un complemento mío, coherente con el objetivo de la pág. 2.)</p>`],
 ["Significado físico de cada secuencia",
  `<ul>
   <li><b>Positiva:</b> es la “útil”, la que produce el par motor y la potencia normal. Un sistema balanceado solo tiene secuencia positiva.</li>
   <li><b>Negativa:</b> aparece con cargas desiguales, fallas y desequilibrios; en máquinas rotativas crea un campo que gira al revés y calienta el rotor.</li>
   <li><b>Cero:</b> no tiene rotación; circula por el neutro y la tierra. La corriente de neutro es I<sub>n</sub> = I<sub>a</sub> + I<sub>b</sub> + I<sub>c</sub> = <b>3I<sub>0</sub></b>. Por eso los transformadores en delta y los neutros sin aterrizar la bloquean.</li></ul>
   <p><b>Errores frecuentes:</b> olvidar el factor ⅓ al pasar de fase a secuencia; confundir a² con a; creer que I<sub>0</sub> existe en una falla entre fases sin tierra (no existe); olvidar que la secuencia cero necesita camino a tierra.</p>`]
];

SUM[1] = [
 ["Carga en estrella con impedancia de neutro",
  `<p>Una carga trifásica en Y, con impedancia Z<sub>y</sub> en cada fase y Z<sub>n</sub> entre el neutro y la tierra, cumple (pág. 19): I<sub>n</sub> = I<sub>a</sub> + I<sub>b</sub> + I<sub>c</sub> y V<sub>an</sub> = I<sub>a</sub>(Z<sub>y</sub> + Z<sub>n</sub>) + I<sub>b</sub>Z<sub>n</sub> + I<sub>c</sub>Z<sub>n</sub> (y análogas para b y c). En forma matricial, la diagonal vale Z<sub>y</sub> + Z<sub>n</sub> y todos los demás elementos valen Z<sub>n</sub>.</p>
   <p>Al transformar con A: <b>Z<sub>012</sub> = A⁻¹ Z<sub>abc</sub> A = diag(Z<sub>y</sub> + 3Z<sub>n</sub>, Z<sub>y</sub>, Z<sub>y</sub>)</b> (pág. 20). Es <b>diagonal</b>: las secuencias quedan desacopladas y se obtienen tres circuitos independientes (pág. 21):</p>
   <ul>
   <li><b>V<sub>0</sub> = (Z<sub>y</sub> + 3Z<sub>n</sub>) I<sub>0</sub></b></li>
   <li>V<sub>1</sub> = Z<sub>y</sub> I<sub>1</sub></li>
   <li>V<sub>2</sub> = Z<sub>y</sub> I<sub>2</sub></li></ul>
   <p><b>¿Por qué 3Z<sub>n</sub>?</b> Por el neutro circula I<sub>n</sub> = 3I<sub>0</sub>, y la caída en Z<sub>n</sub> es 3I<sub>0</sub>Z<sub>n</sub>. Como el circuito de secuencia cero se escribe por unidad de I<sub>0</sub>, esa caída se representa como una impedancia 3Z<sub>n</sub> en serie. <b>Ejemplo:</b> Z<sub>y</sub> = 10 Ω y Z<sub>n</sub> = 5 Ω → Z<sub>0</sub> = 25 Ω y Z<sub>1</sub> = Z<sub>2</sub> = 10 Ω.</p>
   <p class="read">Leer: PDF <b>Componentes</b>, págs. 19–21 (carga en Y), con el dibujo de los tres circuitos en la pág. 21.</p>`],
 ["El neutro y la secuencia cero",
  `<p>Del desarrollo de la pág. 28: I<sub>n</sub> = I<sub>a</sub> + I<sub>b</sub> + I<sub>c</sub> = 3I<sub>0</sub> (los términos de secuencia positiva y negativa suman cero porque 1 + a + a² = 0). De ahí salen cuatro conclusiones que se repiten en los parciales:</p>
   <ul>
   <li>No puede circular corriente de secuencia positiva ni negativa entre el neutro y la tierra, exista o no impedancia de puesta a tierra.</li>
   <li>En el circuito de secuencia cero, la corriente entre neutro y tierra es 3I<sub>0</sub> y la caída de tensión es <b>3I<sub>0</sub>Z<sub>n</sub></b>.</li>
   <li>Si el neutro no está conectado a tierra, Z<sub>n</sub> = ∞ y <b>no hay corriente de secuencia cero</b>.</li>
   <li>Cuando el neutro no está conectado al nodo de referencia, en el circuito de secuencia cero se dibuja un <b>circuito abierto</b>. Si está sólidamente aterrizado (Z<sub>n</sub> = 0) desaparece el término 3Z<sub>n</sub>.</li></ul>`],
 ["Carga en delta",
  `<p>Una carga en delta de impedancia Z<sub>Δ</sub> por rama equivale a una estrella con Z<sub>y</sub> = Z<sub>Δ</sub>/3. Por eso <b>Z<sub>1</sub> = Z<sub>2</sub> = Z<sub>Δ</sub>/3</b>. Como la delta no tiene neutro, <b>Z<sub>0</sub> = ∞</b> para las corrientes que llegan desde la línea: en el circuito de secuencia cero se muestra abierto (pág. 22).</p>`],
 ["Impedancias con acoplamientos (matriz Z<sub>abc</sub>)",
  `<p>En un elemento con impedancias propias (Z<sub>aa</sub>, Z<sub>bb</sub>, Z<sub>cc</sub>) e impedancias mutuas entre fases (Z<sub>ab</sub>, Z<sub>bc</sub>, Z<sub>ca</sub>), se cumple V<sub>mn</sub> = Z<sub>abc</sub> I<sub>abc</sub>. Al sustituir V = A V<sub>012</sub> e I = A I<sub>012</sub> resulta <b>Z<sub>012</sub> = A⁻¹ Z<sub>abc</sub> A</b> (págs. 23–24). En general esta matriz <b>no es diagonal</b>: hay acoplamiento entre secuencias cuando el elemento es asimétrico.</p>
   <p>Las definiciones de la pág. 26 son:</p>
   <ul>
   <li>Z<sub>S0</sub> = ⅓(Z<sub>aa</sub> + Z<sub>bb</sub> + Z<sub>cc</sub>); Z<sub>S1</sub> = ⅓(Z<sub>aa</sub> + aZ<sub>bb</sub> + a²Z<sub>cc</sub>); Z<sub>S2</sub> = ⅓(Z<sub>aa</sub> + a²Z<sub>bb</sub> + aZ<sub>cc</sub>) (términos propios)</li>
   <li>Z<sub>M0</sub> = ⅓(Z<sub>bc</sub> + Z<sub>ca</sub> + Z<sub>ab</sub>); Z<sub>M1</sub> = ⅓(Z<sub>bc</sub> + aZ<sub>ca</sub> + a²Z<sub>ab</sub>); Z<sub>M2</sub> = ⅓(Z<sub>bc</sub> + a²Z<sub>ca</sub> + aZ<sub>ab</sub>) (términos mutuos)</li></ul>
   <p>y la matriz de la pág. 25 queda expresada en esos términos (en la primera diagonal aparece Z<sub>S0</sub> + 2Z<sub>M0</sub>). <b>Caso importante (elemento simétrico, como una línea transpuesta):</b> Z<sub>aa</sub> = Z<sub>bb</sub> = Z<sub>cc</sub> = Z<sub>s</sub> y Z<sub>ab</sub> = Z<sub>bc</sub> = Z<sub>ca</sub> = Z<sub>m</sub>. Entonces Z<sub>S1</sub> = Z<sub>S2</sub> = 0 y la matriz se vuelve diagonal con <b>Z<sub>0</sub> = Z<sub>s</sub> + 2Z<sub>m</sub></b> y <b>Z<sub>1</sub> = Z<sub>2</sub> = Z<sub>s</sub> − Z<sub>m</sub></b>. Esto explica por qué en las líneas Z<sub>0</sub> es mayor que Z<sub>1</sub>: el acoplamiento mutuo se <i>suma</i> en secuencia cero y se <i>resta</i> en las otras. (En la fila 3 de la matriz de la pág. 23 el término escrito Z<sub>ab</sub> debería ser Z<sub>cb</sub>; es una errata de la diapositiva.)</p>
   <p class="read">Leer: PDF <b>Componentes</b>, págs. 23–26 (impedancias con acoplamiento) y 27 (resumen de ideas).</p>`],
 ["Regla de oro de la pág. 27",
  `<p>Como los valores de secuencia son simétricos, <b>solo hace falta conocer una fase</b> (la a) y a partir de ella se obtienen las otras. Además, <b>las corrientes de una secuencia solo producen caídas de tensión en el circuito de esa secuencia</b> (en redes balanceadas, donde Z<sub>012</sub> es diagonal).</p>`]
];

SUM[2] = [
 ["Cómo se dibuja la red de cada secuencia",
  `<p>Cada secuencia tiene su <b>propia red monofásica</b>. Para las secuencias <b>positiva y negativa</b>, la referencia es el <b>neutro</b> del sistema; para la <b>cero</b>, la referencia es la <b>tierra</b>. Solo la red de secuencia positiva contiene <b>fuentes de tensión</b> (las fem de los generadores); las redes negativa y cero no tienen fuentes. Las tres se conectan solo en el punto de falla (tema 4).</p>
   <p class="read">Leer: PDF <b>Componentes</b>, págs. 35 (tabla de circuitos de secuencia de generador, carga y línea) y 36 (conexiones de transformadores, figuras de Anderson).</p>`],
 ["Generador sincrónico",
  `<p>Un generador solo produce tensión de <b>secuencia positiva</b>: su circuito de secuencia positiva es una fuente E en serie con X<sub>1</sub>; los de secuencia negativa y cero son solo impedancias (X<sub>2</sub> y X<sub>0</sub>), en general <b>diferentes</b> entre sí en las máquinas rotativas. Si el neutro está aterrizado a través de Z<sub>n</sub>, en secuencia cero aparece <b>3Z<sub>n</sub></b> en serie con X<sub>0</sub> (tabla de la pág. 35: “X<sub>0</sub> + 3Z<sub>n</sub>”). Si el neutro no está aterrizado, la rama de secuencia cero queda <b>abierta</b>.</p>`],
 ["Cargas",
  `<p>Carga en Y aterrizada (con Z<sub>n</sub>): Z<sub>1</sub> = Z<sub>2</sub> = Z<sub>y</sub>, Z<sub>0</sub> = Z<sub>y</sub> + 3Z<sub>n</sub>. Carga en Y sin aterrizar: secuencia cero abierta. Carga en Δ: Z<sub>1</sub> = Z<sub>2</sub> = Z<sub>Δ</sub>/3 y secuencia cero abierta (ver tema 2).</p>`],
 ["Líneas de transmisión",
  `<p>Son elementos estáticos y simétricos: <b>Z<sub>1</sub> = Z<sub>2</sub></b>. La impedancia de secuencia cero es <b>mayor</b> (valores típicos del orden de 2 a 3,5 veces Z<sub>1</sub>, porque la corriente retorna por la tierra y por los cables de guarda y por el efecto de las impedancias mutuas: Z<sub>0</sub> = Z<sub>s</sub> + 2Z<sub>m</sub>). El rango exacto depende de la geometría y del terreno; es un valor general, no de las diapositivas.</p>`],
 ["Transformadores: las conexiones definen la secuencia cero",
  `<p>Para <b>secuencia positiva y negativa</b> el transformador es simplemente su impedancia de dispersión (Z<sub>1</sub> = Z<sub>2</sub> = Z<sub>cc</sub>). Para la <b>secuencia cero</b>, todo depende de cómo estén conectados los devanados y de si hay puesta a tierra (pág. 36):</p>
   <ul>
   <li><b>Y aterrizada – Y aterrizada:</b> deja pasar la corriente de secuencia cero de un lado al otro; la impedancia es Z<sub>cc</sub> entre las dos barras.</li>
   <li><b>Y aterrizada – Δ:</b> el lado de la Y aterrizada ve Z<sub>cc</sub> conectada a tierra (la delta da un camino de circulación interna, “atrapa” la corriente de secuencia cero); desde el lado de la Δ el circuito está <b>abierto</b> hacia la línea.</li>
   <li><b>Y sin aterrizar (neutro aislado):</b> no hay camino a tierra, el circuito de secuencia cero es <b>abierto</b> en ese devanado.</li>
   <li><b>Δ – Δ:</b> abierto en ambos lados (la secuencia cero puede circular dentro de las deltas pero no sale a la línea).</li>
   <li><b>Impedancia en el neutro Z<sub>n</sub>:</b> se añade 3Z<sub>n</sub> en serie en la rama de secuencia cero.</li>
   <li>Los transformadores de <b>tres devanados</b> y los autotransformadores tienen sus propias figuras (parte izquierda de la pág. 36).</li></ul>
   <p>Complemento general: un transformador Δ–Y desfasa 30° la secuencia positiva y −30° la negativa.</p>`],
 ["Procedimiento para armar las redes de un sistema (ejemplo de la pág. 37)",
  `<ol>
   <li>Parte del diagrama unifilar con <b>conexiones de transformadores y puestas a tierra</b> (generadores G1, G2, G3, transformadores TR1–TR4, líneas LT1 y LT2, carga).</li>
   <li>Escoge una base y lleva todas las impedancias a por unidad.</li>
   <li><b>Red positiva:</b> fuentes (generadores) + impedancias de generadores, transformadores, líneas y cargas.</li>
   <li><b>Red negativa:</b> igual, pero sin fuentes y usando Z<sub>2</sub>.</li>
   <li><b>Red cero:</b> revisa cada transformador y cada neutro: dibuja solo los caminos que realmente llevan corriente de secuencia cero (aterrizado: conecta a tierra; delta: cierra con la impedancia entre su barra y la referencia solo si el otro lado es Y aterrizada; Y aislada: abierto; 3Z<sub>n</sub> en cada neutro con impedancia).</li>
   <li>Reduce cada red a su <b>equivalente de Thévenin</b> visto desde la barra de falla: Z<sub>1</sub>, Z<sub>2</sub>, Z<sub>0</sub> y V<sub>f</sub> (la tensión prefalla, normalmente 1 pu).</li>
   <li>Conecta las tres redes según el tipo de falla (tema 4).</li></ol>
   <p class="read">Leer: PDF <b>Componentes</b>, pág. 37 (ejemplo). Practica construyendo a mano las tres redes de ese unifilar.</p>`]
];

SUM[3] = [
 ["Método general para cualquier falla",
  `<p>(1) Escribe las <b>condiciones de la falla en fases</b> (tensiones y corrientes en el punto de falla). (2) Tradúcelas a <b>secuencias</b> con A⁻¹. (3) Esas relaciones te dicen <b>cómo conectar</b> las tres redes de secuencia (serie o paralelo). (4) Resuelve el circuito: obtienes I<sub>1</sub>, I<sub>2</sub>, I<sub>0</sub> y V<sub>1</sub>, V<sub>2</sub>, V<sub>0</sub>. (5) Vuelve a fases con A. Los tipos más comunes: <b>monofásica a tierra (SLG)</b>, <b>línea-línea (LL)</b>, <b>doble línea a tierra (2LG o DLG)</b>; y además la <b>trifásica</b>, que es simétrica.</p>
   <p>Circuitos de Thévenin de cada secuencia vistos desde el punto de falla: Z<sub>1</sub>, Z<sub>2</sub>, Z<sub>0</sub>; tensión prefalla V<sub>f</sub>. Las tensiones de secuencia en la falla son: V<sub>1</sub> = V<sub>f</sub> − I<sub>1</sub>Z<sub>1</sub>, V<sub>2</sub> = −I<sub>2</sub>Z<sub>2</sub>, V<sub>0</sub> = −I<sub>0</sub>Z<sub>0</sub>.</p>`],
 ["Falla monofásica a tierra (SLG), fase a",
  `<p><b>Condiciones (pág. 29):</b> V<sub>a</sub> = 0 (falla franca), I<sub>b</sub> = 0, I<sub>c</sub> = 0. Con A⁻¹: <b>I<sub>0</sub> = I<sub>1</sub> = I<sub>2</sub> = ⅓ I<sub>a</sub></b> y V<sub>a</sub> = V<sub>0</sub> + V<sub>1</sub> + V<sub>2</sub> = 0. Estas dos condiciones dicen que las tres redes están conectadas en <b>serie</b> (misma corriente por las tres, y la suma de tensiones es cero). Con impedancia de falla Z<sub>f</sub> se añade <b>3Z<sub>f</sub></b> en serie (pág. 30).</p>
   <p><b>Corriente de falla:</b> I<sub>1</sub> = I<sub>2</sub> = I<sub>0</sub> = V<sub>f</sub> / (Z<sub>0</sub> + Z<sub>1</sub> + Z<sub>2</sub> + 3Z<sub>f</sub>) e <b>I<sub>a</sub> = 3I<sub>0</sub> = 3V<sub>f</sub> / (Z<sub>0</sub> + Z<sub>1</sub> + Z<sub>2</sub> + 3Z<sub>f</sub>)</b>.</p>
   <p class="read">Leer: PDF <b>Componentes</b>, págs. 29 (condiciones y deducción) y 30 (circuito serie con 3Z<sub>f</sub>; diapositivas impresas 36 y 37).</p>`],
 ["Falla línea-línea (LL), fases b y c, sin tierra",
  `<p><b>Condiciones (pág. 33):</b> V<sub>b</sub> = V<sub>c</sub>, I<sub>b</sub> = −I<sub>c</sub>, I<sub>a</sub> = 0. Como la tierra no interviene, <b>I<sub>0</sub> = 0</b>. Desarrollando V<sub>b</sub> = V<sub>c</sub> con las secuencias se llega a V<sub>1</sub>(a² − a) = V<sub>2</sub>(a² − a), es decir <b>V<sub>1</sub> = V<sub>2</sub></b>, y de I<sub>0</sub> = (I<sub>a</sub> + I<sub>b</sub> + I<sub>c</sub>)/3 = 0 y I<sub>1</sub> + I<sub>2</sub> = 0 resulta <b>I<sub>1</sub> = −I<sub>2</sub></b>. Eso corresponde a los circuitos de secuencia <b>positiva y negativa en paralelo</b>; el circuito de secuencia cero no participa (pág. 34).</p>
   <p><b>Corriente:</b> I<sub>1</sub> = −I<sub>2</sub> = V<sub>f</sub> / (Z<sub>1</sub> + Z<sub>2</sub> + Z<sub>f</sub>) e I<sub>b</sub> = a²I<sub>1</sub> + aI<sub>2</sub> = (a² − a)I<sub>1</sub> = <b>−j√3 I<sub>1</sub></b>, I<sub>c</sub> = −I<sub>b</sub>. Es decir, |I<sub>b</sub>| = √3 |I<sub>1</sub>|.</p>
   <p class="read">Leer: PDF <b>Componentes</b>, págs. 33–34 (diapositivas impresas 40 y 41).</p>`],
 ["Falla doble línea a tierra (2LG), fases b, c y tierra",
  `<p><b>Condiciones (pág. 31):</b> V<sub>b</sub> = 0, V<sub>c</sub> = 0, I<sub>a</sub> = 0. Entonces I<sub>a</sub> = I<sub>0</sub> + I<sub>1</sub> + I<sub>2</sub> = 0 y V<sub>0</sub> = V<sub>1</sub> = V<sub>2</sub> = ⅓V<sub>a</sub>. Igualdad de tensiones y suma de corrientes cero significa que las tres redes están en <b>paralelo</b> (pág. 32). Con impedancias: la rama de secuencia cero lleva <b>Z<sub>f</sub> + 3Z<sub>g</sub></b>, y las de secuencia positiva y negativa llevan Z<sub>f</sub> (Z<sub>g</sub> es la impedancia a tierra).</p>
   <p>Para Z<sub>f</sub> = 0: I<sub>1</sub> = V<sub>f</sub> / (Z<sub>1</sub> + Z<sub>2</sub> ∥ (Z<sub>0</sub> + 3Z<sub>g</sub>)); la corriente se reparte: I<sub>2</sub> = −I<sub>1</sub> (Z<sub>0</sub> + 3Z<sub>g</sub>)/(Z<sub>2</sub> + Z<sub>0</sub> + 3Z<sub>g</sub>) e I<sub>0</sub> = −I<sub>1</sub> Z<sub>2</sub>/(Z<sub>2</sub> + Z<sub>0</sub> + 3Z<sub>g</sub>). La corriente por tierra es I<sub>b</sub> + I<sub>c</sub> = 3I<sub>0</sub>.</p>
   <p class="read">Leer: PDF <b>Componentes</b>, págs. 31–32 (diapositivas impresas 38 y 39).</p>`],
 ["Falla trifásica (simétrica)",
  `<p>Solo existe secuencia positiva: I<sub>1</sub> = V<sub>f</sub> / (Z<sub>1</sub> + Z<sub>f</sub>), I<sub>0</sub> = I<sub>2</sub> = 0. Es la referencia de comparación para el “peor caso” en capacidad interruptiva.</p>`],
 ["Cómo reconocer cada conexión",
  `<table><thead><tr><th>Falla</th><th>Condiciones</th><th>Redes</th><th>Corriente</th></tr></thead><tbody>
   <tr><td>SLG</td><td>V<sub>a</sub> = 0, I<sub>b</sub> = I<sub>c</sub> = 0</td><td>Tres en <b>serie</b> (+3Z<sub>f</sub>)</td><td>I<sub>a</sub> = 3V<sub>f</sub>/(Z<sub>0</sub>+Z<sub>1</sub>+Z<sub>2</sub>+3Z<sub>f</sub>)</td></tr>
   <tr><td>LL</td><td>I<sub>a</sub> = 0, I<sub>b</sub> = −I<sub>c</sub>, V<sub>b</sub> = V<sub>c</sub></td><td><b>+</b> y <b>−</b> en paralelo (sin 0)</td><td>I<sub>1</sub> = V<sub>f</sub>/(Z<sub>1</sub>+Z<sub>2</sub>+Z<sub>f</sub>); |I<sub>b</sub>| = √3|I<sub>1</sub>|</td></tr>
   <tr><td>2LG</td><td>V<sub>b</sub> = V<sub>c</sub> = 0, I<sub>a</sub> = 0</td><td>Tres en <b>paralelo</b></td><td>I<sub>1</sub> = V<sub>f</sub>/(Z<sub>1</sub>+Z<sub>2</sub>∥(Z<sub>0</sub>+3Z<sub>g</sub>))</td></tr>
   <tr><td>3φ</td><td>V<sub>a</sub> = V<sub>b</sub> = V<sub>c</sub></td><td>Solo la <b>positiva</b></td><td>I<sub>1</sub> = V<sub>f</sub>/(Z<sub>1</sub>+Z<sub>f</sub>)</td></tr></tbody></table>
   <p>Mnemotecnia: <b>SLG = serie</b>; <b>LL = paralelo de dos</b> (positiva y negativa); <b>2LG = paralelo de tres</b>. Las fallas en las que no interviene la tierra (LL y 3φ) tienen <b>I<sub>0</sub> = 0</b>.</p>`],
 ["Ejemplo numérico completo (hazlo a mano)",
  `<p>Datos: Z<sub>1</sub> = Z<sub>2</sub> = j0,2 pu, Z<sub>0</sub> = j0,6 pu, V<sub>f</sub> = 1 pu, falla franca (Z<sub>f</sub> = 0, Z<sub>g</sub> = 0).</p>
   <ul>
   <li><b>3φ:</b> I = 1/0,2 = <b>5 pu</b>.</li>
   <li><b>SLG:</b> I<sub>0</sub> = I<sub>1</sub> = I<sub>2</sub> = 1/(0,6+0,2+0,2) = 1 pu → I<sub>a</sub> = <b>3 pu</b> (menor que la trifásica porque Z<sub>0</sub> es grande).</li>
   <li><b>LL:</b> I<sub>1</sub> = 1/(0,2+0,2) = 2,5 pu → |I<sub>b</sub>| = √3·2,5 ≈ <b>4,33 pu</b>.</li>
   <li><b>2LG:</b> Z<sub>2</sub>∥Z<sub>0</sub> = (0,2·0,6)/0,8 = 0,15 → I<sub>1</sub> = 1/(0,2+0,15) ≈ 2,857 pu; I<sub>2</sub> = −I<sub>1</sub>·0,6/0,8 ≈ −2,143 pu; I<sub>0</sub> = −I<sub>1</sub>·0,2/0,8 ≈ −0,714 pu. Comprobación: I<sub>1</sub> + I<sub>2</sub> + I<sub>0</sub> = 0 ✓. Corriente por tierra = 3I<sub>0</sub> ≈ 2,14 pu.</li></ul>
   <p>Lección: la falla monofásica puede ser <b>mayor o menor</b> que la trifásica según la relación entre Z<sub>0</sub> y Z<sub>1</sub>: si Z<sub>0</sub> &lt; Z<sub>1</sub> (por ejemplo, cerca de un transformador Yg–Δ), la SLG supera a la trifásica.</p>`]
];
SUM[4] = [
 ["Aislante ideal frente a aislamiento real",
  `<p>Un <b>aislante ideal</b> tendría conductividad nula (resistividad infinita): con DC no circularía corriente una vez cargada su capacitancia, y con AC se comportaría como un capacitor perfecto, con la corriente <b>adelantada 90°</b> a la tensión y sin disipar potencia activa. Un <b>aislamiento real</b> tiene <b>conductividad finita</b> σ: bajo un campo E circula una densidad de corriente J = σE muy pequeña pero no nula, además de polarizarse, almacenar energía y disipar parte como calor.</p>
   <p>La conductividad finita aparece porque ningún material es perfectamente puro: hay iones de impurezas o de la disociación de moléculas, portadores generados térmicamente y, en papel-aceite, humedad y productos de degradación. La resistencia de un cuerpo de longitud L y sección A es R = ρL/A (ρ = 1/σ): depende del material <i>y de la geometría</i>, por eso equipos de distinto tamaño no se comparan solo por su resistencia. La energía almacenada es W = ½CV² y debe descargarse con seguridad tras una prueba.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, pág. 4 (sección 2.1) y la Tabla de fenómenos.</p>`],
 ["Los cinco fenómenos que debes distinguir",
  `<ul>
   <li><b>Conducción volumétrica:</b> corriente de portadores a través del <i>volumen</i> del material; permanente y en fase con la tensión.</li>
   <li><b>Conducción superficial:</b> corriente por la <i>superficie externa</i>, favorecida por humedad, polvo, sales o contaminación industrial; depende del estado de la superficie, no del volumen.</li>
   <li><b>Polarización dieléctrica:</b> desplazamiento u orientación limitada de cargas ligadas que forman dipolos al aplicar el campo; da corriente transitoria en DC y pérdidas por fricción en AC.</li>
   <li><b>Almacenamiento de energía:</b> comportamiento capacitivo (energía del campo).</li>
   <li><b>Pérdidas dieléctricas:</b> parte de la energía se convierte en calor por conducción y por fricción de la polarización.</li></ul>
   <p>Una misma medición incluye todos en proporciones que dependen de la tensión (DC/AC), del tiempo y del estado del aislamiento; las pruebas buscan separarlos con el tiempo de medición, la frecuencia o la conexión (guarda).</p>`],
 ["Mecanismos de polarización",
  `<table><thead><tr><th>Mecanismo</th><th>Qué es</th><th>Rapidez</th></tr></thead><tbody>
   <tr><td><b>Electrónica</b></td><td>La nube de electrones se desplaza respecto del núcleo</td><td>Muy rápida (~10<sup>−15</sup> s)</td></tr>
   <tr><td><b>Iónica (atómica)</b></td><td>Iones de signo contrario se desplazan entre sí en la red</td><td>Muy rápida (~10<sup>−13</sup> s)</td></tr>
   <tr><td><b>Dipolar (orientacional)</b></td><td>Moléculas con dipolo permanente (agua, celulosa) giran para alinearse</td><td>Más lenta; depende de la temperatura</td></tr>
   <tr><td><b>Interfacial (Maxwell-Wagner)</b></td><td>Se acumulan cargas en interfaces entre materiales distintos (papel-aceite)</td><td>La más lenta (segundos a minutos o más)</td></tr></tbody></table>
   <p><b>Consecuencia práctica:</b> como los mecanismos tienen <i>constantes de tiempo</i> distintas, al aplicar tensión continua la corriente no cae de golpe: los rápidos solo contribuyen a la corriente de carga inicial; los lentos (dipolar e interfacial) aparecen como la <b>corriente de absorción</b> que decae durante minutos. En AC, la energía disipada depende de qué mecanismos “alcanzan” a seguir el campo a la frecuencia de ensayo: por eso la tangente delta varía con la frecuencia y la temperatura. Una mayor permitividad relativa ε<sub>r</sub> implica mayor capacitancia (P = ε₀(ε<sub>r</sub> − 1)E).</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, pág. 5 (sección 2.2).</p>`],
 ["Efecto de las condiciones del aislamiento",
  `<ul>
   <li><b>Humedad:</b> el agua es molécula polar; aumenta conductividad, polarización dipolar y pérdidas; reduce resistencia y rigidez dieléctrica. En papel-aceite, la celulosa absorbe agua con avidez.</li>
   <li><b>Temperatura:</b> aumenta la movilidad de portadores; baja la resistencia y cambia las pérdidas.</li>
   <li><b>Contaminación superficial:</b> polvo, sales y residuos que con humedad forman un camino conductor; domina la medición aunque el volumen esté sano.</li>
   <li><b>Envejecimiento térmico y oxidación:</b> rompe las cadenas del papel y degrada el aceite; genera <b>agua, ácidos y subproductos polares</b> que aumentan tan δ.</li>
   <li><b>Fisuras, vacíos y delaminaciones:</b> cambian la permitividad efectiva y concentran el campo en el gas, donde ocurren <b>descargas parciales</b> (ionización local sin puentear todo el aislamiento).</li>
   <li><b>Cambios de geometría:</b> deformaciones de devanados o barreras alteran la capacitancia.</li></ul>
   <p>Los factores <b>se refuerzan</b>: el envejecimiento genera agua, el agua acelera el envejecimiento y ambos aumentan las pérdidas. Cada factor afecta distinto a cada prueba: la contaminación superficial perturba sobre todo la medición DC; la humedad en el papel y los vacíos con descargas parciales se revelan mejor en AC. Esa diferencia justifica que las dos pruebas sean <b>complementarias</b>.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, pág. 6 (sección 2.3, tabla de factores).</p>`]
];

SUM[5] = [
 ["Principio de funcionamiento",
  `<p>El <b>megóhmetro</b> aplica una tensión continua estable V, mide la corriente total I con un amperímetro muy sensible y calcula <b>R<sub>iso</sub> = V / I</b>. Unidades: MΩ, GΩ y TΩ. Se usa <b>DC</b> porque tras cargar la capacitancia una sola vez, la corriente que queda depende de la conducción y de la absorción lenta (lo que interesa). Con AC, la corriente capacitiva sería mucho mayor que la resistiva y la enmascararía; además la DC permite observar la <b>respuesta en el tiempo</b>.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, pág. 9 (sección 4.1).</p>`],
 ["Circuito equivalente bajo DC y componentes de corriente",
  `<p>El modelo (Figura de la pág. 9) tiene tres ramas en paralelo: una <b>rama capacitiva C<sub>g</sub></b> (capacitancia geométrica), una o varias <b>ramas de absorción R<sub>i</sub>–C<sub>i</sub></b> en serie y una <b>resistencia de conducción R<sub>p</sub></b>. La corriente total es <b>I<sub>total</sub>(t) = I<sub>C</sub>(t) + I<sub>A</sub>(t) + I<sub>L</sub></b>:</p>
   <ul>
   <li><b>I<sub>C</sub> (capacitiva):</b> carga de C<sub>g</sub>; muy alta al inicio y decae casi de inmediato porque se carga por una resistencia pequeña (instrumento y cables). Más grande y más larga cuanto mayor sea la capacitancia del equipo.</li>
   <li><b>I<sub>A</sub> (absorción):</b> polarización lenta; I<sub>A</sub>(t) = Σ (V/R<sub>k</sub>)·e<sup>−t/τ<sub>k</sub></sup> con τ<sub>k</sub> = R<sub>k</sub>C<sub>k</sub> grande (segundos a minutos), por eso decae más lento que I<sub>C</sub>.</li>
   <li><b>I<sub>L</sub> (conducción o fuga):</b> I<sub>L</sub> = V/R<sub>p</sub>; constante y permanente. Depende de humedad, contaminación, deterioro, temperatura y caminos conductivos internos. <u>No es la única información útil</u>: la respuesta temporal completa también diagnostica. Si hay fuga superficial, se añade una cuarta componente I<sub>S</sub> en paralelo.</li></ul>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, págs. 9–10 (sección 4.2 y subsecciones 4.2.1 a 4.2.3, figuras del circuito y de las corrientes).</p>`],
 ["Fuga superficial y terminal de guarda",
  `<p>Una película de humedad, polvo, sales o contaminación forma un camino sobre la superficie del aislador; esa corriente se suma a la del volumen y <b>baja la resistencia medida</b> aunque el interior esté sano. El megóhmetro tiene tres terminales:</p>
   <ul><li><b>LINE:</b> entrega el positivo de la tensión de prueba al conductor bajo prueba.</li>
   <li><b>EARTH:</b> retorno cuya corriente pasa por el <b>amperímetro</b> y se mide.</li>
   <li><b>GUARD:</b> retorno que se conecta al común de la fuente <b>sin pasar por el amperímetro</b>: la corriente que entra por GUARD <u>no se mide</u>.</li></ul>
   <p>Si rodeas la porcelana contaminada con un hilo o anillo conectado a GUARD, la corriente superficial entra por ese terminal y la lectura corresponde al volumen. También sirve para excluir otros caminos (por ejemplo, la capacitancia a tierra de un devanado cuando mides solo entre dos devanados).</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, pág. 11 (sección 4.3, figura de LINE/EARTH/GUARD).</p>`],
 ["Evolución de la resistencia con el tiempo",
  `<p>La resistencia calculada es R(t) = V/I<sub>total</sub>(t). Como I<sub>C</sub> e I<sub>A</sub> decaen, I<sub>total</sub> baja y R <b>aumenta</b> durante los primeros minutos, hasta aproximarse a V/I<sub>L</sub>. Una sola lectura instantánea no basta: al inicio la corriente está dominada por la carga y la absorción; dos aislamientos con igual lectura inicial pueden tener conducciones muy distintas. En un aislamiento sano la resistencia sube con claridad; en uno húmedo o contaminado la conducción domina y la curva es casi plana.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, pág. 11 (sección 4.4).</p>`],
 ["Índice de polarización (PI) y relación de absorción dieléctrica (DAR)",
  `<p><b>PI = R<sub>10 min</sub> / R<sub>1 min</sub></b>. Compara la resistencia a largo plazo con la de corto plazo y pretende observar la <b>absorción</b>. Aislamiento seco y sano: I<sub>A</sub> apreciable que decae → PI claramente mayor que 1. Si la conducción domina (humedad, contaminación): PI ≈ 1.</p>
   <p><b>Qué altera su interpretación:</b> temperatura, fuga superficial, carga residual de pruebas previas, resistencias tan altas que la corriente cae bajo la resolución del instrumento (PI ≈ 1 sin defecto) y la tecnología del aislamiento. Por eso <b>no existe un criterio universal</b>. El PI es una herramienta reconocida en devanados de <b>máquinas rotativas</b> (IEEE 43 recomienda mínimos según la clase térmica); en transformadores, cables y otros se usa con más cautela, y en equipos pequeños (TC, TP, bushings) aporta poco porque la absorción se agota pronto.</p>
   <p><b>DAR = R<sub>t2</sub> / R<sub>t1</sub></b> con t₂ &gt; t₁. Es una versión corta del PI; una referencia habitual del fabricante usa 60 s / 30 s, pero otras fuentes usan intervalos distintos, así que siempre se debe reportar con los tiempos usados.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, págs. 11–12 (secciones 4.5 y 4.6).</p>`],
 ["Prueba de paso de tensión y descarga dieléctrica (DD)",
  `<p><b>Paso de tensión (step voltage):</b> se sube la tensión en escalones iguales (1 kV, 2 kV, 3 kV…) con la misma duración cada uno y se registra R al final. Un aislamiento aproximadamente lineal mantiene R casi <b>constante</b>; si R <b>cae</b> al subir la tensión, indica fisuras, humedad localizada o defectos que se activan con el campo. Limitaciones: exige escalones iguales; la absorción puede falsear si son cortos; la temperatura puede variar; y el esfuerzo creciente puede dañar un aislamiento deteriorado.</p>
   <p><b>Descarga dieléctrica (DD):</b> se carga largo tiempo, se cortocircuita y se mide la corriente de <b>reabsorción</b> a 1 minuto: DD = I<sub>1 min</sub> / (V·C). Informa sobre aislamientos <b>multicapa</b> con vacíos o delaminaciones (generadores, cables). Su interpretación es más específica que la de PI/DAR.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, pág. 12 (secciones 4.7 y 4.8).</p>`],
 ["Tensiones de prueba",
  `<p>No hay un valor universal: depende del equipo, su tensión nominal y el documento de referencia. Ejemplo de <b>IEEE 43</b> (devanados de máquinas rotativas): &lt; 1000 V → 500 V; 1000–2500 V → 500–1000 V; 2501–5000 V → 1000–2500 V; 5001–12 000 V → 2500–5000 V; &gt; 12 000 V → 5000–10 000 V (verifica la edición vigente). Para transformadores se sigue IEEE C57.152 y al fabricante, sin superar la tensión nominal de línea a tierra del devanado ni la capacidad del instrumento. Una tensión excesiva puede <b>dañar</b> un aislamiento deteriorado, iniciar descargas o perforar zonas débiles.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, pág. 13 (sección 4.9).</p>`]
];

SUM[6] = [
 ["Dieléctrico ideal y real bajo tensión alterna",
  `<p>Un capacitor ideal con v = V<sub>m</sub> sen ωt conduce i = ωCV<sub>m</sub> cos ωt: la corriente se <b>adelanta 90°</b> a la tensión y la potencia media es nula (toma energía y la devuelve), es decir, <b>no disipa potencia activa</b>. Un dieléctrico real sí disipa por <b>conducción</b> (fuga) y por la <b>fricción de la reorientación de dipolos</b> en cada ciclo. Su corriente tiene dos componentes: la <b>capacitiva I<sub>C</sub></b> (adelantada 90°, almacenamiento) y la <b>resistiva I<sub>R</sub></b> (en fase con V, pérdidas); la total I es su suma fasorial.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, pág. 13 (secciones 5.1 y 5.2).</p>`],
 ["Circuitos equivalentes, diagrama fasorial y definición de tan δ",
  `<ul>
   <li><b>Modelo paralelo</b> (C<sub>p</sub> en paralelo con R<sub>p</sub>): I<sub>C</sub> = ωC<sub>p</sub>V, I<sub>R</sub> = V/R<sub>p</sub> → <b>tan δ = 1/(ωC<sub>p</sub>R<sub>p</sub>)</b>. Representa bien las pérdidas por conducción.</li>
   <li><b>Modelo serie</b> (C<sub>s</sub> en serie con R<sub>s</sub>): <b>tan δ = ωC<sub>s</sub>R<sub>s</sub></b>, con ω = 2πf. Útil para pérdidas en conductores y contactos.</li>
   <li>Ambos describen el <b>mismo</b> comportamiento externo con parámetros equivalentes: C<sub>p</sub> = C<sub>s</sub>/(1 + tan²δ) y R<sub>p</sub> = (1 + tan²δ)/(ωC<sub>s</sub> tan δ). Para pérdidas pequeñas C<sub>p</sub> ≈ C<sub>s</sub>.</li></ul>
   <p><b>Diagrama fasorial</b> (V como referencia): I<sub>C</sub> a 90° de V, I<sub>R</sub> en fase con V, I = I<sub>C</sub> + I<sub>R</sub> con ángulo de fase φ respecto de V. El <b>ángulo de pérdidas δ</b> es el complemento de φ: <b>δ = 90° − φ</b>, y <b>tan δ = I<sub>R</sub> / I<sub>C</sub></b>. Un aislamiento ideal tiene φ = 90° y δ = 0. Un <b>aumento de tan δ</b> significa que por cada unidad de corriente capacitiva circula más corriente resistiva: se disipa más energía (más humedad, productos polares o descargas parciales).</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, págs. 14 (secciones 5.3 y 5.4, con las figuras de los modelos y del fasorial).</p>`],
 ["Tangente delta, factor de disipación y factor de potencia",
  `<ul>
   <li><b>tan δ</b> = I<sub>R</sub>/I<sub>C</sub> (cociente entre la corriente resistiva y la capacitiva).</li>
   <li><b>Factor de disipación (DF)</b> = tan δ (numéricamente idéntico).</li>
   <li><b>Factor de potencia (PF)</b> = cos φ = cos(90° − δ) = <b>sen δ</b> (relación entre I<sub>R</sub> e I, la corriente total).</li></ul>
   <p>Para ángulos pequeños, sen δ ≈ tan δ ≈ δ (en radianes), por lo que PF y DF son numéricamente muy próximos aunque conceptualmente distintos; la diferencia se nota cuando las pérdidas son grandes. En la práctica, las guías <b>IEEE</b> hablan de <b>factor de potencia</b> y las <b>IEC</b> de <b>factor de disipación</b>.</p>`],
 ["Capacitancia y potencia disipada",
  `<p>Los instrumentos miden también la <b>capacitancia</b> porque, para obtener tan δ, deben separar la componente en cuadratura con la tensión, que es <b>I<sub>C</sub> = ωCV</b> (C = I<sub>C</sub>/ωV). Un cambio de C respecto de mediciones anteriores, de otras fases, de equipos equivalentes o de valores de fábrica puede significar: cortocircuito entre capas en un bushing tipo condensador (C <b>aumenta</b>), pérdida de capas o de aceite (C disminuye), deformación de devanados en un transformador (cambia la capacitancia entre devanados) o humedad (sube un poco).</p>
   <p><b>Potencia disipada:</b> P = V·I<sub>R</sub> = <b>V² ω C tan δ</b>, con P en W, V eficaz, ω = 2πf, C en F. Se convierte en calor; si el calor generado crece más rápido que el que se disipa, la temperatura sube, las pérdidas aumentan más y puede haber <b>embalamiento térmico</b>.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, pág. 15 (secciones 5.5, 5.6 y 5.7).</p>`],
 ["Puente de Schering y equipos modernos",
  `<p>El <b>puente de Schering</b> es el fundamento histórico. Compara el espécimen (C<sub>x</sub> en serie con R<sub>x</sub>) con un <b>capacitor patrón C<sub>n</sub></b> de pérdidas muy bajas (aislado en gas, p. ej. SF₆ o nitrógeno); la otra rama tiene R<sub>3</sub> y R<sub>4</sub> en paralelo con C<sub>4</sub>; un detector D indica el equilibrio. En equilibrio Z<sub>x</sub>Z<sub>4</sub> = Z<sub>n</sub>Z<sub>3</sub> y, separando partes real e imaginaria:</p>
   <p style="text-align:center"><b>C<sub>x</sub> = C<sub>n</sub> R<sub>4</sub>/R<sub>3</sub></b> &nbsp; y &nbsp; <b>tan δ = ωC<sub>x</sub>R<sub>x</sub> = ωR<sub>4</sub>C<sub>4</sub></b> &nbsp; (R<sub>x</sub> = R<sub>3</sub>C<sub>4</sub>/C<sub>n</sub>).</p>
   <p>Los <b>equipos modernos</b> (OMICRON, Doble, Megger) miden digitalmente: aplican AC, miden la corriente (con derivación o sensor) usando una <b>referencia de fase</b>, separan por procesamiento digital (detección síncrona o Fourier) la componente <b>en fase</b> (I<sub>R</sub>) y la <b>en cuadratura</b> (I<sub>C</sub>), y calculan C, tan δ o PF y las pérdidas en vatios (P = V·I<sub>R</sub>). Para <b>filtrar interferencias</b> del patio miden a frecuencias distintas de la de red con filtros de banda estrecha. Frente a Schering: no hay equilibrado manual, es más rápido, entrega varias magnitudes a la vez y permite barrer frecuencias.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, pág. 16 (secciones 6.1 y 6.2, figura del puente).</p>`],
 ["Modos de prueba GST, GSTg y UST",
  `<p>Un espécimen típico (por ejemplo, dos devanados y el tanque) tiene tres capacitancias: <b>C<sub>HL</sub></b> entre los terminales H y L, <b>C<sub>H</sub></b> de H a tierra y <b>C<sub>L</sub></b> de L a tierra. El instrumento energiza H:</p>
   <table><thead><tr><th>Modo</th><th>Conexión de L</th><th>Qué mide</th><th>Cuándo</th></tr></thead><tbody>
   <tr><td><b>GST</b> (Grounded Specimen Test)</td><td>L a <b>tierra</b></td><td>C<sub>H</sub> + C<sub>HL</sub> (corriente que retorna por tierra)</td><td>Evaluación global de un aislamiento a tierra</td></tr>
   <tr><td><b>GSTg</b> (con guarda)</td><td>L a <b>guarda</b></td><td>Solo C<sub>H</sub> (se excluye C<sub>HL</sub>)</td><td>Aislamiento a tierra de un devanado, separado de otro</td></tr>
   <tr><td><b>UST</b> (Ungrounded Specimen Test)</td><td>L a la <b>entrada de medida</b></td><td>Solo C<sub>HL</sub> (se ignora la fuga a tierra)</td><td>Aislamiento <i>entre</i> dos terminales: devanado–devanado, núcleo C1 de un bushing, CVT</td></tr></tbody></table>
   <p><b>Guarda en tan δ vs. GUARD del megóhmetro:</b> ambos desvían una corriente para que no se mida, pero en tan δ la corriente excluida es de AC y puede ser capacitiva (p. ej., C<sub>HL</sub>), no solo fuga superficial resistiva; además, la guarda debe estar al mismo potencial que la entrada de medida.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, págs. 17–18 (secciones 7.1 a 7.4 con los tres circuitos y la tabla comparativa).</p>`],
 ["Incremento de tan δ con la tensión (tip-up)",
  `<p><b>Δtan δ = tan δ(V<sub>alta</sub>) − tan δ(V<sub>baja</sub>)</b>; por ejemplo, se mide a 2 kV y a 10 kV. En un dieléctrico lineal y sano tan δ casi no cambia con la tensión (tip-up pequeño). Si hay <b>vacíos o delaminaciones</b>, al subir la tensión el gas alcanza su tensión de inicio y se ioniza (<b>descargas parciales</b>), aparecen pérdidas adicionales y tan δ sube. Es útil en bobinas de generadores, bushings de papel y resina y aislamientos con gas atrapado. Es una técnica <b>complementaria</b>: no necesariamente una prueba rutinaria y periódica de todos los equipos.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, pág. 18 (sección 8, figura de tan δ vs. V).</p>`]
];

SUM[7] = [
 ["Dónde sirve cada prueba (aplicabilidad)",
  `<table><thead><tr><th>Equipo</th><th>R aislamiento (DC)</th><th>Tangente delta (AC)</th></tr></thead><tbody>
   <tr><td>Transformador de potencia</td><td>Habitual (humedad, contaminación, fallas gruesas)</td><td><b>Muy habitual</b>: prueba principal del aislamiento</td></tr>
   <tr><td>TC, TP, CVT</td><td>Habitual (CVT: limitada)</td><td>Habitual en papel-aceite o tipo condensador; CVT: unidades capacitivas</td></tr>
   <tr><td>Bushing</td><td>Habitual, sensibilidad limitada</td><td><b>Muy habitual</b> (C1 y C2)</td></tr>
   <tr><td>Interruptor</td><td>Habitual (a tierra y entre contactos abiertos)</td><td>Condicional (si hay bushings, condensadores de gradación o aceite)</td></tr>
   <tr><td>Seccionador</td><td>Habitual como verificación de aisladores</td><td>Poco útil</td></tr>
   <tr><td>Pararrayos ZnO</td><td>Condicional</td><td>Poco útil</td></tr></tbody></table>
   <p><b>Por qué:</b> en transformadores, equipos de instrumento y bushings el aislamiento principal es papel impregnado en aceite o resina, multicapa; la humedad y los productos de degradación son <i>polares</i> y suben las pérdidas en AC, y la capacitancia permite medir con precisión y aislar terminales. En el <b>seccionador</b> el aislante principal es el aire libre (no se mide), los soportes son porcelana o polímero macizo, la capacitancia es pequeña y domina la fuga superficial: basta R<sub>iso</sub> con guarda e inspección. En el <b>pararrayos de ZnO</b> los varistores son no lineales (corriente muy dependiente de tensión y temperatura), por lo que tan δ no refleja su estado; la corriente de fuga es casi toda capacitiva y la componente resistiva (la que indica deterioro) se identifica mejor con el <b>tercer armónico</b> o las <b>pérdidas en vatios</b>. En el <b>interruptor</b> depende del diseño: en SF₆ o vacío solo se evalúan soportes, barras y bushings, no el medio de extinción.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, págs. 7–8 (sección 3, tablas de aplicabilidad y los cuatro argumentos).</p>`],
 ["Factores que afectan las mediciones",
  `<ul>
   <li><b>Temperatura:</b> en R<sub>iso</sub> la resistencia baja aproximadamente a la <b>mitad por cada 10 °C</b> de aumento (IEEE 43 corrige a 40 °C en máquinas rotativas; regla aproximada, no general). En tan δ, IEEE C57.152 normaliza el PF a <b>20 °C</b> con factores según el tipo de equipo; la corrección es una estimación porque depende de la humedad y el envejecimiento. La temperatura relevante es la del aislamiento (en transformador, la del aceite).</li>
   <li><b>Humedad:</b> en superficie forma película conductora (medir con el equipo por encima de la temperatura de <b>rocío</b>); en papel y aceite aumenta pérdidas y baja la resistencia.</li>
   <li><b>Contaminación superficial:</b> camino en paralelo con el volumen; se mitiga con <b>guarda</b> o modo UST.</li>
   <li><b>Tensión:</b> defectos no lineales (vacíos, fisuras con humedad) → paso de tensión en DC, tip-up en AC.</li>
   <li><b>Frecuencia:</b> relevante solo en AC; los dipolos responden distinto según la frecuencia.</li>
   <li><b>Tiempo:</b> crucial en DC (la corriente decae minutos); en AC la medición es de régimen permanente y se estabiliza casi de inmediato.</li></ul>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, págs. 19–20 (sección 9, tabla comparada y subsecciones).</p>`],
 ["Procedimiento de campo y seguridad",
  `<ol>
   <li><b>Condiciones previas:</b> equipo desenergizado, aislamiento visible y efectivo, <b>verificación de ausencia de tensión</b>, descarga previa, puesta a tierra temporal, identificar elementos a desconectar (barras, pararrayos, TP), bloqueo y etiquetado (LOTO), limpieza y secado de superficies.</li>
   <li><b>Preparación:</b> identificar equipo y placa; registrar temperatura del equipo y ambiente, humedad relativa y estado superficial; definir conexiones y modos; seleccionar tensión; verificar el instrumento (cables, guarda).</li>
   <li><b>Ejecución:</b> en DC lecturas a 1 min y 10 min (paso de tensión: tiempo igual por escalón); en AC subir la tensión gradualmente, medir C, tan δ/PF, corriente y potencia.</li>
   <li><b>Finalización:</b> retirar la tensión con la rampa de descarga, <b>descargar</b> el equipo a tierra un tiempo al menos comparable al de aplicación (en equipos de gran capacitancia, varias veces), verificar ausencia de carga residual, retirar cables, reconectar, quitar tierras temporales.</li>
   <li><b>Seguridad:</b> alta tensión (hasta 10–12 kV), <b>energía almacenada</b> W = ½CV² (letal aun sin fuente), tensión residual (sobre todo en DC), delimitar el área, tierras, LOTO y EPP (guantes y calzado dieléctricos, casco, protección visual); nadie toca terminales con tensión aplicada.</li></ol>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, págs. 20–22 (sección 10, tabla de ejecución comparada).</p>`],
 ["Interpretación de resultados",
  `<p>Nunca se interpreta por valores absolutos aislados. Importan: la <b>tendencia histórica</b> (comparar con mediciones anteriores, valores de fábrica, fases equivalentes y equipos similares: el cambio respecto del propio equipo es lo más informativo); en <b>R<sub>iso</sub></b>: disminución progresiva, dependencia de la tensión, PI cercano a 1 o curva plana (humedad/contaminación), diferencias entre fases; en <b>tan δ</b>: incremento de pérdidas, cambio de capacitancia, diferencias entre fases, tip-up. <b>Diagnóstico integrado:</b> ninguna prueba identifica por sí sola todos los mecanismos; se complementa con DGA (análisis de gases disueltos), humedad y acidez del aceite, SFRA (respuesta en frecuencia), descargas parciales, termografía, relación de transformación y corriente de excitación.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, pág. 22 (sección 11) y tabla comparativa de la pág. 23 (sección 12).</p>`],
 ["Comparación entre R aislamiento y tan δ (las 7 preguntas clave)",
  `<ol>
   <li><b>¿R alta garantiza tan δ adecuada?</b> No: la DC no excita las pérdidas dependientes de polarización ni las descargas parciales.</li>
   <li><b>¿tan δ baja garantiza que no hay problemas?</b> No: un defecto localizado o una fuga pequeña aporta poca corriente frente a la capacitancia total.</li>
   <li><b>¿Detectan los mismos mecanismos?</b> No: DC = conducción y absorción lenta; AC = pérdidas a frecuencia de red e ionización de vacíos.</li>
   <li><b>¿Por qué son complementarias?</b> Observan el mismo dieléctrico con excitaciones distintas.</li>
   <li><b>Contaminación de la porcelana:</b> en DC baja R y PI sin que el volumen esté dañado; en AC se suma a I<sub>R</sub> y altera tan δ y C aparente (efecto relativo menor en equipos de gran capacitancia).</li>
   <li><b>Uso de la guarda:</b> desvía la corriente de un terminal o superficie sin pasar por el medidor; permite medir solo entre los terminales deseados.</li>
   <li><b>Circuito equivalente:</b> asocia cada rasgo de la medición con un elemento físico (corriente inicial ↔ C<sub>g</sub>, decaimiento lento ↔ ramas R<sub>i</sub>–C<sub>i</sub>, valor final ↔ R<sub>p</sub>; en AC, I<sub>R</sub>/I<sub>C</sub> ↔ tan δ).</li></ol>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, pág. 23 (sección 12).</p>`],
 ["Caso del transformador de potencia de dos devanados",
  `<p>Aislamientos: <b>C<sub>H</sub></b> (alta–tierra), <b>C<sub>L</sub></b> (baja–tierra) y <b>C<sub>HL</sub></b> (alta–baja: canales de aceite y barreras). Cada uno se representa con el modelo DC (Z<sub>HL</sub>, Z<sub>H</sub>, Z<sub>L</sub>). En un transformador trifásico se unen los terminales de cada devanado.</p>
   <table><thead><tr><th>Medición</th><th>LINE / HV</th><th>EARTH / medida</th><th>GUARD</th><th>Mide</th></tr></thead><tbody>
   <tr><td>R, H contra L+tanque</td><td>H</td><td>L y tanque</td><td>—</td><td>C<sub>H</sub> ∥ C<sub>HL</sub></td></tr>
   <tr><td>R, L contra H+tanque</td><td>L</td><td>H y tanque</td><td>—</td><td>C<sub>L</sub> ∥ C<sub>HL</sub></td></tr>
   <tr><td>R, H contra L</td><td>H</td><td>L</td><td>tanque</td><td>C<sub>HL</sub></td></tr>
   <tr><td>tan δ, UST</td><td>H</td><td>L (medida)</td><td>tanque a tierra</td><td>C<sub>HL</sub></td></tr>
   <tr><td>tan δ, GSTg</td><td>H</td><td>tierra</td><td>L a guarda</td><td>C<sub>H</sub></td></tr>
   <tr><td>tan δ, GST</td><td>H</td><td>tierra y L</td><td>—</td><td>C<sub>H</sub> + C<sub>HL</sub></td></tr></tbody></table>
   <p><b>Magnitudes:</b> en DC R a 1 y 10 min, PI, DAR, temperatura del aceite; en AC C, tan δ o PF, corriente, potencia, tensión y frecuencia. <b>Comparar con:</b> valores de fábrica, histórico, otras fases y equipos equivalentes. <b>Errores típicos:</b> temperatura mal estimada, humedad o suciedad en bushings, interferencia en patio, cable de guarda defectuoso, carga residual, distinta tensión entre mediciones, contribución de los bushings, instrumento sin calibrar. <b>Si hay anomalías:</b> DGA, humedad y acidez del aceite, furfural o grado de polimerización, SFRA, relación, resistencia de devanados, excitación, descargas parciales, termografía.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, págs. 24–26 (sección 13, figuras y tabla de conexiones).</p>`],
 ["Segundo equipo: pararrayos de ZnO; instrumentos, normas y valores",
  `<p><b>Pararrayos de ZnO sin explosores:</b> R<sub>iso</sub> es <b>condicional</b> (detecta cortocircuito de varistores o humedad evidente, comparando con historial y unidades hermanas: LINE a la parte superior, EARTH a la inferior, GUARD a un anillo en la envolvente); tan δ es <b>poco útil</b>; lo <b>habitual</b> es la corriente de fuga con la componente resistiva por <b>tercer armónico</b> (IEC 60099-5), las pérdidas en vatios y la termografía. Limitaciones: no linealidad, temperatura, fuga superficial y falta de criterios universales (pág. 26).</p>
   <p><b>Instrumentos</b> (pág. 27): <b>Megger MIT1025</b> (megóhmetro DC hasta 10 kV, PI, DAR, paso de tensión, DD, terminales LINE/EARTH/GUARD) y <b>OMICRON CPC 100 + CP TD1</b> (tan δ/PF y capacitancia hasta 12 kV AC, modos GST/GSTg/UST, frecuencia variable que ayuda a filtrar interferencias). Las especificaciones se verifican en las hojas de datos.</p>
   <p><b>Normas</b> (pág. 27): <b>IEEE 43</b> (máquinas rotativas, resistencia de aislamiento), <b>IEEE C57.152</b> (diagnóstico en campo de transformadores llenos de fluido), IEEE C57.12.90 (código de pruebas), IEEE C57.19.01 (bushings), IEC 60076 (transformadores), <b>IEC 60137</b> (bushings), IEC 62271 (aparamenta), IEEE C62.11 y <b>IEC 60099-5</b> (pararrayos), ANSI/NETA ATS/MTS y <b>RETIE</b> (seguridad de instalaciones en Colombia). No se atribuye a una norma un criterio que no establece.</p>
   <p><b>Valores de referencia</b> (pág. 28): siempre con equipo, tecnología, temperatura, tensión, frecuencia y fuente; se distingue entre límite normativo, recomendación del fabricante, valor típico, criterio estadístico, experiencia de mantenimiento y tendencia histórica. No se usan tablas genéricas de “bueno/regular/malo”.</p>
   <p class="read">Leer: PDF <b>Pruebas de diagnóstico</b>, págs. 26 (pararrayos), 27 (instrumentos y normas), 28 (valores) y 29 (conclusiones).</p>`]
];
SUM[8] = [
 ["El sistema eléctrico de potencia y la subestación",
  `<p>El sistema de potencia tiene tres etapas en orden: <b>generación</b> (transforma la energía primaria —hidráulica, térmica, solar— en eléctrica), <b>transmisión</b> (alta y muy alta tensión, grandes bloques de potencia a largas distancias) y <b>distribución</b> (media y baja tensión, entrega a los usuarios finales). En medio están las <b>subestaciones</b>: instalaciones donde se interconectan líneas, transformadores y equipos de maniobra. Sus funciones son <b>transformar niveles de tensión</b>, <b>conmutar circuitos</b>, conectar y repartir la energía (barrajes), proteger, medir y controlar. Una subestación <b>convertidora AC/DC</b> es el corazón de los sistemas <b>HVDC</b> (transmisión en corriente continua a alta tensión, para grandes distancias o interconexiones asíncronas).</p>
   <p>La <b>aparamenta</b> es el conjunto de <b>aparatos de conmutación</b> (interruptores, seccionadores, etc.) con sus equipos asociados de control, medida, protección y regulación, junto con conexiones, accesorios, envolventes y soportes.</p>
   <p>Normas de referencia del programa: <b>IEEE 80</b> (seguridad en puesta a tierra de subestaciones AC), <b>IEC 61936-1</b> (instalaciones de más de 1 kV AC) e <b>IEC 60071</b> (coordinación de aislamiento).</p>`],
 ["Valores asignados (nomenclatura IEC)",
  `<p>Los <b>valores asignados</b> (rated values) son las magnitudes que el fabricante garantiza para unas condiciones normalizadas de servicio y que se usan con fines de <b>especificación</b> (datos de placa, pliegos, compras). El subíndice <b>r</b> viene de <i>rated</i>. No son los valores del sistema (la tensión nominal del sistema es U<sub>n</sub>; la tensión asignada del equipo es U<sub>r</sub>).</p>
   <table><thead><tr><th>Símbolo</th><th>Significado</th></tr></thead><tbody>
   <tr><td><b>U<sub>r</sub></b></td><td>Tensión asignada: valor eficaz de la tensión entre fases para la cual se diseña la aparamenta</td></tr>
   <tr><td><b>f<sub>r</sub></b></td><td>Frecuencia asignada (50 o 60 Hz)</td></tr>
   <tr><td><b>I<sub>r</sub></b></td><td>Corriente asignada en servicio continuo: la máxima que puede circular continuamente sin calentamiento inadmisible</td></tr>
   <tr><td><b>I<sub>k</sub></b></td><td>Corriente soportada de corta duración asignada (valor eficaz; efecto térmico)</td></tr>
   <tr><td><b>t<sub>k</sub></b></td><td>Duración de cortocircuito asignada (típicamente 1 s o 3 s)</td></tr>
   <tr><td><b>I<sub>p</sub></b></td><td>Corriente soportada de cresta asignada (valor pico; esfuerzos mecánicos/electrodinámicos)</td></tr>
   <tr><td><b>U<sub>d</sub></b></td><td>Tensión soportada asignada a frecuencia industrial de corta duración (ensayo de 1 min)</td></tr>
   <tr><td><b>U<sub>p</sub></b></td><td>Tensión soportada asignada al impulso tipo rayo (nivel básico de aislamiento, BIL)</td></tr>
   <tr><td><b>U<sub>s</sub></b></td><td>Tensión soportada asignada al impulso de maniobra</td></tr>
   <tr><td><b>U<sub>a</sub></b></td><td>Tensión de alimentación asignada de los circuitos auxiliares y de mando</td></tr>
   <tr><td><b>U<sub>c</sub></b></td><td>Tensión de operación continua de un pararrayos</td></tr>
   <tr><td><b>S<sub>r</sub></b></td><td>Potencia aparente asignada de un transformador de potencia</td></tr></tbody></table>
   <p>La <b>serie normalizada de corrientes asignadas continuas</b> es la <b>R10</b> (serie Renard: 400, 630, 1250 A…). Además, las características asignadas definen las especificaciones comunes para la <b>selección y montaje</b> de la aparamenta. (U<sub>m</sub>, tensión más elevada para el material, y la regla “U<sub>n</sub> ≠ U<sub>r</sub>” son complementos de IEC 60071/62271.)</p>`]
];

SUM[9] = [
 ["Interruptor de potencia",
  `<p>Es el dispositivo de maniobra capaz de <b>establecer, conducir e interrumpir corrientes</b> tanto en condiciones normales como de <b>falla (cortocircuito)</b>. A diferencia del seccionador, tiene <b>cámara de extinción</b>: el espacio donde se forma, controla y extingue el arco. El <b>arco eléctrico</b> es una columna de <b>plasma</b> que conduce corriente entre los contactos al separarse.</p>
   <ul>
   <li><b>SF₆:</b> el gas participa en el <b>aislamiento</b> y en la <b>extinción</b> del arco (flujo a presión); es electronegativo y de alta rigidez dieléctrica (mayor que la del aceite y la del aire); la <b>elongación y enfriamiento</b> (extinción) del arco se logran con su flujo a presión; domina en interruptores modernos y en subestaciones GIS. El ensayo de <b>hermeticidad</b> verifica que no haya fugas y que la presión mantenga la rigidez dieléctrica.</li>
   <li><b>Vacío:</b> medio ampliamente usado en <b>media tensión</b>; no hay gas que ionizar, el arco de vapor metálico se <b>autoextingue</b> al primer cruce por cero.</li>
   <li><b>TRV</b> (tensión transitoria de restablecimiento): tensión entre contactos justo tras extinguir el arco. Si supera la rigidez dieléctrica que ya recuperó el espacio entre contactos, ocurre el <b>reencendido</b>, que la cámara debe evitar.</li>
   <li><b>Secuencia O–CO:</b> apertura, luego un cierre seguido de apertura inmediata (recierre automático para fallas transitorias en líneas aéreas).</li>
   <li><b>Operación:</b> hasta 145 kV es común <b>tripolar</b> (un mecanismo para las tres fases); en tensiones iguales o superiores a 220 kV (Colombia) <b>unipolar</b> (un mecanismo por polo), lo que permite reenganche monofásico. Algunos reconectadores de distribución también son unipolares.</li>
   <li>El <b>tiempo de apertura</b> se suma al del relé en la <b>coordinación</b> de protecciones. El interruptor es el “músculo”; el relé de protección es el “cerebro” que detecta y ordena el disparo.</li>
   <li>Mantenimiento/ensayos: resistencia de contactos (en µΩ; verifica continuidad y desgaste), tiempos de operación, hermeticidad.</li></ul>`],
 ["Seccionador y cuchillas de puesta a tierra",
  `<p>El <b>seccionador</b> proporciona un <b>corte visible</b> (aislamiento visible entre sus terminales cuando está abierto) para que el personal trabaje con seguridad. Se opera <b>sin carga</b> (sin corriente): no tiene cámara de extinción y no puede interrumpir corriente de carga ni de falla.</p>
   <ul>
   <li><b>Usos:</b> corte visible para mantenimiento; crear un <b>by-pass</b> (ruta alterna para dar mantenimiento a un interruptor sin botar la carga); modificar la configuración de los <b>barrajes</b> (transferencia entre barras).</li>
   <li><b>Tipos:</b> <b>pantógrafo</b> (articulado tipo tijera; su parte móvil se eleva verticalmente para conectarse a la barra superior) y <b>giratorio horizontal</b> (el eje de apertura gira horizontalmente).</li>
   <li><b>Accionamiento:</b> todos tienen opción de operación <b>manual</b> (palanca o manivela, emergencia); la operación remota usa accionamiento <b>motorizado</b> (maniobra desde la sala de control o el SCADA).</li>
   <li><b>Cuchillas de puesta a tierra:</b> conectan a tierra (<b>aterrizan</b>) equipos <b>desenergizados</b> para seguridad durante el mantenimiento y disipan tensiones <b>residuales o inducidas</b>. Solo se cierran con el equipo desenergizado.</li>
   <li><b>Mantenimiento rutinario:</b> limpieza, lubricación y ajuste de los contactos; ensayo de resistencia de contacto estática.</li></ul>`],
 ["Relés auxiliares (familia COMBIFLEX)",
  `<p>Los relés de protección detectan la falla, pero necesitan <b>relés auxiliares</b> y un interruptor que ejecute la orden. Según su función:</p>
   <ul>
   <li><b>Multiplicación de contactos:</b> permite obtener varios contactos a partir de una sola señal.</li>
   <li><b>Enclavamiento (bloqueo):</b> impide una maniobra cuando no se cumplen determinadas condiciones (por ejemplo, cerrar la cuchilla de tierra con el equipo energizado).</li>
   <li><b>Señalización:</b> proporciona una <b>señal</b> de la ocurrencia de una condición o actuación.</li>
   <li><b>Disparo:</b> actúa sobre el circuito de apertura del interruptor (bobina de <b>apertura</b>) y envía la orden de <b>disparo</b>; los de alta velocidad se emplean para accionar la bobina de apertura y requieren un tiempo de operación <b>muy corto</b>.</li></ul>`]
];

SUM[10] = [
 ["Transformador de potencia",
  `<p>Su <b>función</b> es modificar los niveles de <b>tensión</b> y corriente del sistema (conservando la potencia y la frecuencia, salvo pérdidas). Su <b>principio físico</b> es la <b>inducción electromagnética</b>: un flujo variable en el núcleo induce tensión en los devanados.</p>
   <ul>
   <li><b>Pérdidas:</b> en el <b>núcleo (hierro)</b>, casi constantes, “en vacío” (histéresis y corrientes de Foucault); en los <b>devanados (cobre)</b>, I²R, que crecen con la carga.</li>
   <li><b>Aceite:</b> cumple funciones de <b>aislamiento</b> y de <b>refrigeración</b>.</li>
   <li><b>S<sub>r</sub>:</b> potencia aparente asignada, la que puede suministrar continuamente.</li>
   <li><b>Grupo de conexión vectorial</b> (por ejemplo, Dyn11): identifica la forma de conexión de los <b>devanados</b> y el desfase entre primario y secundario.</li>
   <li><b>Impedancia de cortocircuito:</b> es la impedancia que contribuye a <b>limitar la corriente de falla</b>.</li>
   <li><b>Cambiador de tomas bajo carga:</b> el sistema de control puede ordenar remotamente un cambio de <b>posición</b> de las tomas para regular la tensión.</li>
   <li><b>Altitud:</b> un transformador estándar instalado a más de 1000 msnm debe <b>derratearse</b> (reducir su capacidad), porque el aire más tenue refrigera y aísla menos.</li>
   <li><b>Ensayos:</b> relación de transformación, resistencia de devanados (DC), prueba de vacío (corriente de excitación), DGA, resistencia de aislamiento y tan δ.</li></ul>`],
 ["Transformadores de medida: TC y TP",
  `<p><b>TC (corriente):</b> el devanado primario se conecta en <b>serie</b> con el circuito cuya corriente se quiere reproducir. El secundario tiene valores normalizados de <b>1 A o 5 A</b> y debe mantenerse siempre <b>cerrado</b> (abierto induce sobretensiones peligrosas). La <b>clase de exactitud</b> expresa la capacidad de reproducir la corriente primaria en el secundario con errores limitados; una clase <b>numéricamente menor</b> en un TC de medida (0,2 frente a 0,5) corresponde a un error <b>menor</b>. Los TC de <b>protección</b> (5P, 10P) deben mantener su exactitud en cortocircuito: el <b>ALF</b> (factor límite de exactitud) es el múltiplo de la corriente nominal hasta el que lo logran (5P20: error compuesto de 5 % hasta 20 veces I<sub>n</sub>). En un TC de <b>medida</b>, un <b>factor de seguridad (FS)</b> bajo hace que el núcleo sature antes y proteja los equipos de medida conectados al secundario.</p>
   <p><b>TP (tensión o potencial):</b> reducen la tensión del sistema a valores adecuados para <b>medición, protección o control</b>. Se distinguen en <b>inductivos</b> (acoplamiento magnético) y <b>capacitivos</b> (CVT/CCVT; divisor de condensadores, para muy alta tensión). Durante la <b>sincronización</b>, los TP suministran señales de <b>tensión</b> (y de ahí frecuencia y ángulo de fase) a los sistemas de medición y sincronismo. La <b>clase de precisión</b> define la exactitud (error de relación y de ángulo). Se verifican relación y polaridad para tener mediciones (facturación) y <b>protecciones</b> confiables. Ensayos de TC: relación, polaridad, resistencia de devanados secundarios y tan δ en los de papel-aceite.</p>`]
];

SUM[11] = [
 ["Pararrayos de óxido metálico",
  `<p>Su función es <b>proteger</b> los equipos contra <b>sobretensiones transitorias</b> (atmosféricas y de maniobra; eventos de microsegundos a milisegundos): limita la amplitud de la tensión y deriva la onda a tierra. El componente principal son los bloques de <b>óxido de zinc (ZnO)</b> —varistores—, que reemplazaron a los antiguos de carburo de silicio con explosores. Para proteger, el pararrayos debe tener un comportamiento <b>altamente no lineal</b>: alta impedancia (casi aislante) a tensión normal y camino de baja impedancia (conductor) durante la sobretensión.</p>
   <ul>
   <li><b>U<sub>c</sub>:</b> tensión de operación continua (la máxima que soporta permanentemente).</li>
   <li><b>Corriente de descarga nominal:</b> la corriente de impulso empleada para definir la <b>tensión residual</b>.</li>
   <li><b>Tensión residual:</b> la tensión máxima que aparece entre los terminales durante el paso de una corriente de impulso; el equipo protegido debe soportar más que eso (margen de protección).</li>
   <li><b>Capacidad térmica de energía:</b> energía total que puede absorber sin daño térmico.</li>
   <li><b>Conexión a tierra corta y directa:</b> reduce la inductancia del conductor y por tanto la sobretensión adicional.</li>
   <li><b>EGLA</b> (<i>Externally Gapped Line Arrester</i>): pararrayos de línea con explosor externo en serie.</li>
   <li>En servicio, la corriente de fuga (capacitiva + resistiva) es el mejor indicador de estado (tercer armónico, ver tema 8).</li></ul>`]
];

SUM[12] = [
 ["Aisladores",
  `<p>Función <b>eléctrica:</b> impedir el paso no deseado de corriente entre una parte energizada y tierra. Función <b>mecánica:</b> proporcionar <b>soporte</b> a conductores, barras o equipos manteniendo el aislamiento. Se fabrican en porcelana, vidrio o materiales <b>poliméricos</b> (compuestos). Usan <b>faldones o aletas</b> para aumentar la línea de fuga y controlar corrientes superficiales. La <b>limpieza</b> periódica reduce la corriente de fuga. El envejecimiento se acelera con la <b>temperatura</b>, la humedad, la <b>contaminación</b> y la radiación solar (especialmente en poliméricos). Un aislamiento <b>externo</b> está expuesto al aire (humedad, contaminación, radiación solar, salinidad); el <b>interno</b> está dentro de la envolvente y no está expuesto directamente. El aislamiento <b>autorecuperable</b> (aire, SF₆) restablece sus propiedades tras una descarga disruptiva; el sólido no.</p>`],
 ["Barrajes, conductores y conexiones",
  `<p>El <b>barraje</b> (barra colectora) es el <b>punto común</b> (nodo) al que se conectan varios circuitos de una subestación para un nivel de tensión; enlaza los equipos principales y transfiere energía entre bahías. Suele ser de <b>aluminio</b> o <b>cobre</b> (tubo o cable). Los terminales y conectores de aluminio se seleccionan según el material y las dimensiones del <b>conductor</b>.</p>
   <ul>
   <li><b>Corrosión galvánica:</b> riesgo especial en una conexión aluminio–cobre (par bimetálico con humedad); se mitiga con conectores bimetálicos.</li>
   <li><b>Compuesto antioxidante:</b> aplicado en conexiones de aluminio limita la oxidación y mejora la <b>conexión</b>.</li>
   <li><b>Presión de contacto:</b> en conectores atornillados, una presión adecuada mantiene baja la resistencia <b>eléctrica</b> de la unión.</li>

SUM[13] = [
 ["Humedad relativa, punto de rocío y condensación",
  `<p>La <b>humedad relativa</b> (HR) expresa la cantidad de vapor de agua presente respecto de la <b>máxima</b> que el aire podría contener a esa temperatura: HR = (vapor presente / vapor máximo) × 100 %. <b>Ejemplo del parcial:</b> 7,5 g presentes y 15 g como máximo → HR = 50 %.</p>
   <ul>
   <li>Si la temperatura <b>baja</b> con el mismo contenido de vapor, el máximo disminuye y la HR <b>aumenta</b>.</li>
   <li>La HR llega al 100 % en la <b>saturación</b>. La temperatura a la cual ocurre es el <b>punto de rocío</b>; ahí el vapor empieza a condensarse.</li>
   <li>La diferencia entre la temperatura ambiente y el punto de rocío es el <b>margen</b> antes de alcanzar la saturación: cuanto menor, mayor el riesgo de <b>condensación</b>.</li>
   <li>Un cambio brusco de temperatura en un período de alta humedad puede llevar el aire a la saturación.</li></ul>
   <p><b>Efectos:</b> en aisladores, humedad alta favorece caminos <b>conductores</b> (tracking); en gabinetes aumenta el riesgo de <b>condensación</b> (y de cortocircuitos); con temperatura alta favorece la <b>corrosión</b>; en climas fríos sube la viscosidad de los <b>fluidos</b> (aceites y lubricantes); los equipos de interior deben evitar la exposición a la <b>radiación solar</b>. Mitigación típica: resistencias calefactoras, ventilación y deshumidificación.</p>`]
];

SUM[14] = [

  `<p>El cobre y el aluminio son <b>commodities</b>: materias primas estandarizadas y <b>fungibles</b>, negociables internacionalmente en bolsas de metales.</p>

   <li><b>Precio spot:</b> precio al que se puede adquirir el metal para <b>entrega inmediata</b>. El spot del cobre en bolsa representa el valor de la <b>materia prima</b>, no el precio final de un conductor terminado.</li>
   <li><b>Conductor terminado:</b> cuesta más que el metal porque incorpora manufactura, transporte y <b>valor agregado</b>.</li>
   <li><b>Precio futuro / contrato de futuros:</b> acuerdo que fija hoy el precio para comprar o vender en una fecha <b>futura</b>.</li>
   <li><b>Volatilidad:</b> cambio del precio entre preparar la oferta y comprar el material. Si pasan meses, existe <b>riesgo de precio</b>: si cotizas hoy una obra con mucho cobre y el precio <b>sube</b> antes de comprar, tu costo aumenta.</li>
   <li><b>Cobertura (hedging):</b> uso de instrumentos financieros (como futuros) para reducir la exposición a variaciones futuras.</li>
   <li><b>Reajuste:</b> cláusula o fórmula contractual que actualiza ciertos componentes del precio según índices definidos (mano de obra, equipos, materiales). Es típica en contratos de obra de larga duración.</li>
   <li>Si asumes precio fijo dos años sin cobertura ni reajuste, una subida importante del metal reduce tu <b>margen</b>.</li></ul>
   <p><b>Ejemplo:</b> el cobre pesa 40 % del costo de un conductor y su precio sube 10 % entre la oferta y la compra: el costo total sube cerca de 4 %, que se descuenta del margen si no hay cobertura ni reajuste.</p>`]
];

// ---------- Remapeo de las preguntas de los parciales anteriores ----------
function nz(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function remapOld(t,q){
  const x=nz(q);
  if(t===0||t===1) return 8;
  if(t===2) return 16;
  if(t===3||t===4) return 9;
  if(t===5) return 10;
  if(t===6) return 11;
  if(t===7){
    if(/humedad relativa|punto de rocio|humedad alta|corrosion|radiacion|viscosidad|condens/.test(x)) return 13;
    if(/1000 msnm|deratear|derratear|1500 msnm/.test(x)) return 10;
    if(/funcion principal del aislamiento|restablecer sus propiedades/.test(x)) return 4;
    if(/mitad por cada/.test(x)) return 5;
    return 12;
  }
  if(t===8){
    if(/tangente delta|perdidas dielectricas|dielectrico ideal|componente de corriente en fase|puente utilizado/.test(x)) return 6;
    if(/resistencia de aislamiento|megohmetro|indice de polarizacion|terminal adicional|corriente medida/.test(x)) return 5;
    if(/resistencia de contacto|constriccion|metodo de cuatro|corrientes de prueba|area de contacto|aumento progresivo|contactos/.test(x)) return 12;
    if(/secundario abierto|gases disueltos|devanados|relacion de transformacion/.test(x)) return 10;
    if(/hermeticidad|interruptores sellados/.test(x)) return 9;
    return 7;
  }
  if(t===9){
    if(/barrajes|enlazar los equipos/.test(x)) return 12;
    return 15;
  }
  return 15;
}

// ---------- utilidades ----------
function norm(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[µμ]/g,'u').replace(/²/g,'2').replace(/³/g,'3').replace(/√/g,'raiz')
    .replace(/δ/g,'delta').replace(/φ/g,'phi').replace(/,/g,'.').replace(/[^a-z0-9./]/g,'').replace(/\.+$/,'');
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); }
    prev=cur;
  }
  return prev[n];
}
function check(inp,acc){
  const x=norm(inp); if(!x) return false;
  for(const a of acc){
    const y=norm(a); if(!y) continue;
    if(x===y) return true;
    if(/^[0-9.\/]+$/.test(y) && x.startsWith(y) && !/[0-9]/.test(x.slice(y.length))) return true;
    if(y.length>=4 && x.includes(y)) return true;
    const d=lev(x,y);
    if(y.length>=6 && d<=1) return true;
    if(y.length>=10 && d<=2) return true;
  }
  return false;
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function qhtml(q){return esc(q).replace(/_{2,}/g,'<span class="blank">________</span>');}
