  document.getElementById('rprev').onclick=function(){ resTopic--; viewResumen(); window.scrollTo(0,0); };
  document.getElementById('rnext').onclick=function(){ resTopic++; viewResumen(); window.scrollTo(0,0); };
  document.getElementById('rprac').onclick=function(){ pr.group='all'; pr.topic=String(resTopic); pr.src='all'; pr.onlyFails=false; pr.queue=[]; tab='practicar'; render(); };
}

// ---------- Practicar ----------
let pr={group:'all',topic:'all',src:'all',onlyFails:false,queue:[],i:0,answered:false};
function filtered(){
  return ITEMS.filter(i=>inGroup(i,pr.group)
    && (pr.topic==='all'||i.t===Number(pr.topic))
    && (pr.src==='all'||srcKind(i)===pr.src)
    && (!pr.onlyFails||state.fails[i.id]));
}
function buildQueue(){
  const its=filtered();
  if(pr.onlyFails) pr.queue=shuffle(its);
  else pr.queue=shuffle(its.filter(i=>!state.known[i.id])).concat(shuffle(its.filter(i=>state.known[i.id])));
  pr.i=0; pr.answered=false;
}
function viewPracticar(){
  if(!pr.queue.length || pr.i>=pr.queue.length) buildQueue();
  const gopts='<option value="all">Todos los bloques</option>'+Object.keys(GROUPS).map(g=>'<option value="'+g+'"'+(pr.group===g?' selected':'')+'>'+esc(GROUPS[g].name)+'</option>').join('');
  const topts='<option value="all">Todos los temas</option>'+TOPICS.map((n,t)=>'<option value="'+t+'"'+(String(pr.topic)===String(t)?' selected':'')+'>'+esc(n)+'</option>').join('');
  const sopts=[['all','Todas las fuentes'],['p1','Solo Parcial 1'],['p2','Solo Parcial 2 (2026-1)'],['old','Solo parciales anteriores'],['new','Solo preguntas nuevas']].map(o=>'<option value="'+o[0]+'"'+(pr.src===o[0]?' selected':'')+'>'+o[1]+'</option>').join('');
  let h='<div class="card"><div class="row"><select id="pgroup" aria-label="Bloque">'+gopts+'</select><select id="ptopic" aria-label="Tema">'+topts+'</select><select id="psrc" aria-label="Fuente">'+sopts+'</select></div>'+
    '<div class="row" style="margin-top:8px"><label class="small"><input type="checkbox" id="pfails"'+(pr.onlyFails?' checked':'')+'> Solo las que fallé</label><button class="btn" id="pshuf" type="button">Mezclar</button></div></div>';
  if(!pr.queue.length){
    h+='<div class="card"><p>No hay frases para este filtro. Cambia los filtros o desmarca "Solo las que fallé".</p></div>';
    view.innerHTML=h; bindPFilters(); return;
  }
  const it=pr.queue[pr.i];
  h+='<div class="card"><div class="row" style="justify-content:space-between"><span class="chip">'+esc(TOPICS[it.t])+'</span><span class="chip">'+(pr.i+1)+' / '+pr.queue.length+'</span></div>'+
    (it.src?'<div class="note src">Fuente: '+esc(it.src)+'</div>':'')+
    '<p class="q">'+qhtml(it.q)+'</p>'+
    '<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe la palabra que falta" aria-label="Respuesta">'+
    '<div class="row" style="margin-top:10px"><button class="btn primary" id="chk" type="button">Comprobar</button><button class="btn" id="show" type="button">Ver respuesta</button><button class="btn" id="next" type="button">Siguiente</button></div>'+
    '<div id="fb"></div></div>';
  view.innerHTML=h; bindPFilters();
  const ans=document.getElementById('ans'); ans.focus();
  const fb=document.getElementById('fb');
  function reveal(ok,text){
    pr.answered=true;
    const note=it.n?'<div class="note">'+esc(it.n)+'</div>':'';
    fb.innerHTML='<div class="fb '+(ok?'ok':'bad')+'">'+text+'<br><b>Respuesta:</b> '+esc(it.a[0])+(it.a.length>1?' <span class="small">(también: '+esc(it.a.slice(1,4).join(', '))+')</span>':'')+note+'</div>';
  }
  function doCheck(){
    if(pr.answered) return;
    const v=ans.value.trim(); if(!v){ ans.focus(); return; }
    const ok=check(v,it.a); mark(it.id,ok);
    reveal(ok, ok?'Correcto.':'No coincide con la respuesta esperada.');
  }
  function goNext(){ pr.i++; pr.answered=false; if(pr.i>=pr.queue.length) buildQueue(); viewPracticar(); }
  document.getElementById('chk').onclick=doCheck;
  ans.onkeydown=function(e){ if(e.key==='Enter'){ pr.answered?goNext():doCheck(); } };
  document.getElementById('show').onclick=function(){ if(!pr.answered){ mark(it.id,false); reveal(false,'Para repasar.'); } };
  document.getElementById('next').onclick=goNext;
}
function bindPFilters(){
  document.getElementById('pgroup').onchange=function(){ pr.group=this.value; pr.topic='all'; buildQueue(); viewPracticar(); };
  document.getElementById('ptopic').onchange=function(){ pr.topic=this.value; buildQueue(); viewPracticar(); };
  document.getElementById('psrc').onchange=function(){ pr.src=this.value; buildQueue(); viewPracticar(); };
  document.getElementById('pfails').onchange=function(){ pr.onlyFails=this.checked; buildQueue(); viewPracticar(); };
  document.getElementById('pshuf').onclick=function(){ buildQueue(); viewPracticar(); };
}

// ---------- Simulacro ----------
let sim={items:[],answers:[],i:0,done:false,n:30,group:'all'};
function startSim(){
  const pool=ITEMS.filter(i=>inGroup(i,sim.group));
  sim.items=shuffle(pool).slice(0,Math.min(sim.n,pool.length));
  sim.answers=sim.items.map(()=>''); sim.i=0; sim.done=false;
}
function viewSimulacro(){
  if(!sim.items.length){
    const gopts='<option value="all">Todo (acumulativo)</option>'+Object.keys(GROUPS).map(g=>'<option value="'+g+'"'+(sim.group===g?' selected':'')+'>'+esc(GROUPS[g].name)+'</option>').join('');
    view.innerHTML='<div class="card"><h2 style="margin-top:0">Simulacro</h2>'+
      '<p>Frases al azar, como en el parcial. No verás las respuestas hasta el final.</p>'+
      '<div class="row"><select id="simg" aria-label="Bloque">'+gopts+'</select>'+
      '<select id="simn" aria-label="Número de frases"><option>20</option><option selected>30</option><option>40</option><option>60</option><option>80</option></select>'+
      '<button class="btn primary" id="go" type="button">Empezar</button></div></div>';
    document.getElementById('go').onclick=function(){ sim.n=parseInt(document.getElementById('simn').value,10); sim.group=document.getElementById('simg').value; startSim(); viewSimulacro(); };
    return;
  }
  if(sim.done) return viewSimResult();
  const it=sim.items[sim.i];
  view.innerHTML='<div class="card"><div class="row"><span class="chip">Frase '+(sim.i+1)+' de '+sim.items.length+'</span></div>'+
    '<p class="q">'+qhtml(it.q)+'</p>'+
    '<input type="text" id="sans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Respuesta" value="'+esc(sim.answers[sim.i])+'">'+
    '<div class="row" style="margin-top:10px"><button class="btn" id="prev" type="button"'+(sim.i===0?' disabled':'')+'>Anterior</button>'+
    '<button class="btn primary" id="nx" type="button">'+(sim.i===sim.items.length-1?'Terminar y corregir':'Siguiente')+'</button></div></div>';
  const inp=document.getElementById('sans'); inp.focus();
  function store(){ sim.answers[sim.i]=inp.value; }
  function fwd(){ store(); if(sim.i===sim.items.length-1){ sim.done=true; viewSimulacro(); } else { sim.i++; viewSimulacro(); } }
  document.getElementById('nx').onclick=fwd;
  document.getElementById('prev').onclick=function(){ store(); sim.i--; viewSimulacro(); };
  inp.onkeydown=function(e){ if(e.key==='Enter') fwd(); };
}
function viewSimResult(){
  let ok=0; let rows='';
  sim.items.forEach((it,k)=>{
    const good=check(sim.answers[k]||'',it.a);
    if(good) ok++;
    mark(it.id,good);
    if(!good){
      rows+='<div class="fixrow"><div>'+qhtml(it.q)+'</div><div class="small"><b>Tu respuesta:</b> '+(sim.answers[k]?esc(sim.answers[k]):'(en blanco)')+' &nbsp; <b>Correcta:</b> '+esc(it.a[0])+'</div>'+(it.n?'<div class="note">'+esc(it.n)+'</div>':'')+'</div>';
    }
  });
  const pct=Math.round(100*ok/sim.items.length);
  const nota=(5*ok/sim.items.length).toFixed(1);
  view.innerHTML='<div class="card"><h2 style="margin-top:0">Resultado</h2>'+
    '<p><b>'+ok+' de '+sim.items.length+'</b> ('+pct+'%). Equivale a '+nota+' sobre 5,0 en esta práctica.</p>'+
    '<p class="note">Aquí se tolera una tilde o una letra suelta; en el parcial real escribe la palabra completa y bien.</p>'+
    '<div class="row"><button class="btn primary" id="again" type="button">Otro simulacro</button><button class="btn" id="tofails" type="button">Practicar lo que fallé</button></div></div>'+
    (rows?'<h3>Para corregir</h3>'+rows:'<div class="card">Sin errores. Muy bien.</div>');
  document.getElementById('again').onclick=function(){ sim.items=[]; viewSimulacro(); };
  document.getElementById('tofails').onclick=function(){ pr.group='all'; pr.topic='all'; pr.src='all'; pr.onlyFails=true; pr.queue=[]; tab='practicar'; render(); };
}

  let h='<div class="card"><h2 style="margin-top:0">Ambigüedades, erratas y límites de esta guía</h2>';

(function(){

  var host=document.createElement('div');

  host.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:2147483000;display:block;visibility:visible;opacity:1;';
  var root=host.attachShadow({mode:'closed'});

  function wmUrl(){
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220">'+
      '<g transform="rotate(-24 180 110)" fill="rgb(128,128,128)" fill-opacity="0.13" font-family="Georgia,serif" font-size="15">'+

  }
  function build(){
    root.innerHTML=
     '<style>'+
     ':host{all:initial}'+
     '*{pointer-events:none!important;user-select:none!important;-webkit-user-select:none!important}'+
     '.wm{position:absolute;left:0;top:0;right:0;bottom:0;background-image:'+wmUrl()+';background-repeat:repeat}'+
     '.seal{position:absolute;right:12px;bottom:56px;width:112px;height:112px;transform:rotate(-10deg);opacity:.92;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}'+

     '@media print{.seal{bottom:12px}.credit{bottom:8px}}'+

       '<text x="100" y="78" text-anchor="middle" font-family="Georgia,serif" font-size="9" letter-spacing="1" fill="var(--acc,#1f5fa8)">DESARROLLADO POR</text>'+
       '<text x="100" y="102" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="var(--acc,#1f5fa8)">Daniel S.</text>'+
